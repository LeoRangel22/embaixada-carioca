name: Phase 2 performance SEO audit
# trigger: como chegar final visible lock 2026-05-21

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_phase2_quick_fixes.py'
      - 'scripts/apply_visible_text_css_link.py'
      - 'scripts/apply_como_chegar_final_visible_lock.py'
      - 'scripts/audit_phase2_performance_seo.py'
      - 'assets/css/ec-visible-text-lock.css'
      - 'index.html'
      - 'cafe-da-manha.html'
      - 'almoco.html'
      - 'cardapio.html'
      - 'como-chegar.html'
      - 'eventos.html'
      - 'guia-do-rio.html'
      - '.github/workflows/phase2-performance-seo-audit.yml'

permissions:
  contents: write

jobs:
  phase2-performance-seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply safe Phase 2 quick fixes
        run: python3 scripts/apply_phase2_quick_fixes.py

      - name: Link visible text CSS lock
        run: python3 scripts/apply_visible_text_css_link.py

      - name: Apply Como Chegar final visible lock
        run: python3 scripts/apply_como_chegar_final_visible_lock.py

      - name: Run Phase 2 performance SEO audit
        run: |
          set +e
          python3 scripts/audit_phase2_performance_seo.py
          audit_exit=$?
          echo "Phase 2 audit raw exit code: ${audit_exit}"

          if [ ! -f _audit_reports/phase2_performance_seo_audit.md ]; then
            echo "ERROR: phase2_performance_seo_audit.md was not generated."
            exit 1
          fi

          echo "Phase 2 performance findings are advisory. Report generated successfully."
          exit 0

      - name: Show reports
        if: always()
        run: |
          if [ -f _audit_reports/phase2_quick_fixes_report.md ]; then cat _audit_reports/phase2_quick_fixes_report.md; fi
          echo '---'
          if [ -f _audit_reports/visible_text_css_link_report.md ]; then cat _audit_reports/visible_text_css_link_report.md; fi
          echo '---'
          if [ -f _audit_reports/como_chegar_final_visible_lock_report.md ]; then cat _audit_reports/como_chegar_final_visible_lock_report.md; fi
          echo '---'
          if [ -f _audit_reports/phase2_performance_seo_audit.md ]; then cat _audit_reports/phase2_performance_seo_audit.md; fi

      - name: Commit Phase 2 reports and quick fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: apply como chegar final visible lock and update audit'
          file_pattern: >-
            index.html
            cafe-da-manha.html
            almoco.html
            cardapio.html
            como-chegar.html
            eventos.html
            guia-do-rio.html
            _audit_reports/phase2_quick_fixes_report.md
            _audit_reports/visible_text_css_link_report.md
            _audit_reports/como_chegar_final_visible_lock_report.md
            _audit_reports/phase2_performance_seo_audit.md
