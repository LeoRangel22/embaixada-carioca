name: one-off nav underline and copy fix

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/one-off-nav-underline-and-copy-fix.yml"

permissions:
  contents: write

jobs:
  fix-nav-underline-and-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply nav underline spacing and copy fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          changed = []

          # 1) Shared CSS: reduce only the underline gap. Do not change nav/menu position.
          css = root / 'assets/css/ec-stabilization-base.css'
          if css.exists():
              text = css.read_text(encoding='utf-8', errors='ignore')
              new = text.replace('bottom: -7px !important;', 'bottom: -3px !important;')
              if new != text:
                  css.write_text(new, encoding='utf-8')
                  changed.append(str(css))

          # 2) Inline override for standalone pages that do not load shared nav CSS.
          # It changes only the pseudo-element underline, never nav height, padding or transform.
          override = '''
<style id="ec-nav-hover-tight-lock">
/* EC nav hover underline: closer to text, no menu layout shift */
nav.top .nav-links a,
nav.top .links a{position:relative;}
nav.top .nav-links a::after,
nav.top .links a::after{content:"";position:absolute;left:0;right:auto;top:auto!important;bottom:-3px!important;width:0;max-width:100%;min-width:0;height:2px;background:var(--amarelo,var(--ec-yellow,#f59b1e));opacity:0;transform:none!important;transition:width .22s ease,opacity .18s ease;}
nav.top .nav-links a:hover::after,
nav.top .links a:hover::after,
nav.top .nav-links a:focus-visible::after,
nav.top .links a:focus-visible::after{width:100%;opacity:1;}
</style>
'''.strip()

          replacements = [
              ('Restaurante do Bondinho', 'Restaurante no Bondinho'),
              ('restaurante do Bondinho', 'restaurante no Bondinho'),
              ('restaurante do bondinho', 'restaurante no bondinho'),
              ('RESTAURANTE DO BONDINHO', 'RESTAURANTE NO BONDINHO'),
          ]

          skip_dirs = {'.git', '.github', '_audit_reports', 'archive', 'node_modules'}
          for html_path in root.rglob('*.html'):
              if any(part in skip_dirs for part in html_path.parts):
                  continue
              html = html_path.read_text(encoding='utf-8', errors='ignore')
              new = html

              # Remove any earlier one-off block if it exists.
              new = re.sub(r'\n?/\* EC nav underline tight standard[\s\S]*?\.nav-links a::after\{bottom:-3px!important;\}\n?', '\n', new)

              for old, repl in replacements:
                  new = new.replace(old, repl)

              if 'ec-nav-hover-tight-lock' not in new and '</head>' in new:
                  new = new.replace('</head>', override + '\n</head>', 1)

              if new != html:
                  html_path.write_text(new, encoding='utf-8')
                  changed.append(str(html_path))

          wf = root / '.github/workflows/one-off-nav-underline-and-copy-fix.yml'
          if wf.exists():
              wf.unlink()
              changed.append(str(wf))

          print('changed files:')
          for item in sorted(set(changed)):
              print('-', item)
          PY

      - name: Commit nav underline and copy fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: tighten nav underline and update Bondinho copy"
          file_pattern: |
            assets/css/ec-stabilization-base.css
            **/*.html
            .github/workflows/one-off-nav-underline-and-copy-fix.yml
