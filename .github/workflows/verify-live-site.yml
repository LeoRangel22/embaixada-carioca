name: Verify live site

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '*/30 * * * *'

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check live version sentinel
        run: |
          set -e
          curl -fsSL --max-time 20 "https://www.embaixadacarioca.com/version.json?ts=$(date +%s)" -o /tmp/version.json
          cat /tmp/version.json
          # Verify site_version field is present and not empty
          python3 -c "
          import json, sys
          v = json.load(open('/tmp/version.json'))
          if not v.get('site_version'):
              print('ERROR: site_version missing in version.json', file=sys.stderr)
              sys.exit(1)
          print('OK: site_version =', v['site_version'])
          if v.get('deploy_sha'):
              print('OK: deploy_sha =', v['deploy_sha'])
          "
          # Verify the site_version matches what we expect from this repo
          EXPECTED=$(python3 -c "import json; print(json.load(open('version.json'))['site_version'])")
          LIVE=$(python3 -c "import json; print(json.load(open('/tmp/version.json'))['site_version'])")
          echo "Expected site_version: $EXPECTED"
          echo "Live    site_version: $LIVE"
          [ "$EXPECTED" = "$LIVE" ] || { echo "WARN: live site_version does not match repo (deploy may be in progress)"; }

      - name: Check EN home is not stale
        run: |
          set -e
          curl -fsSL --max-time 20 "https://www.embaixadacarioca.com/en/?ts=$(date +%s)" -o /tmp/en.html
          ! grep -q "BondinhSugarloaf" /tmp/en.html
          ! grep -q "Bondinhel" /tmp/en.html
          ! grep -q "Private events up to 300" /tmp/en.html
          ! grep -q "Quando Every day" /tmp/en.html
          ! grep -q "Harmonização" /tmp/en.html
          ! grep -q "Roteiros & grupos" /tmp/en.html
          grep -q "Bondinho Pão de Açúcar Park" /tmp/en.html
          grep -q "breakfast, Brazilian lunch and sunset drinks" /tmp/en.html

      - name: Check ES home is not stale
        run: |
          set -e
          curl -fsSL --max-time 20 "https://www.embaixadacarioca.com/es/?ts=$(date +%s)" -o /tmp/es.html
          ! grep -q "Bondinhel" /tmp/es.html
          ! grep -q "PRÊMIO" /tmp/es.html
          ! grep -q "Quando" /tmp/es.html
          ! grep -q "Harmonização" /tmp/es.html
          grep -q "Parque Bondinho" /tmp/es.html

      - name: Check key public pages respond 200
        run: |
          set -e
          for url in \
            "https://www.embaixadacarioca.com/" \
            "https://www.embaixadacarioca.com/almoco" \
            "https://www.embaixadacarioca.com/cafe-da-manha" \
            "https://www.embaixadacarioca.com/eventos" \
            "https://www.embaixadacarioca.com/en/" \
            "https://www.embaixadacarioca.com/es/"; do
            echo "Checking $url"
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" --max-time 20 "$url?ts=$(date +%s)")
            echo "  HTTP $HTTP"
            [ "$HTTP" = "200" ] || { echo "ERROR: $url returned $HTTP"; exit 1; }
          done

      - name: Check offline fallback is served
        run: |
          set -e
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" --max-time 20 "https://www.embaixadacarioca.com/offline.html")
          echo "offline.html HTTP $HTTP"
          [ "$HTTP" = "200" ] || { echo "ERROR: offline.html returned $HTTP"; exit 1; }

      - name: Check sitemap and robots
        run: |
          set -e
          curl -fsSL --max-time 20 "https://www.embaixadacarioca.com/sitemap.xml" -o /tmp/sitemap.xml
          grep -q "embaixadacarioca.com" /tmp/sitemap.xml
          echo "OK: sitemap.xml served and contains domain"
          curl -fsSL --max-time 10 "https://www.embaixadacarioca.com/robots.txt" -o /tmp/robots.txt || true
          echo "OK: robots.txt check done"
