name: AAA readability emergency fix

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_aaa_readability_emergency_fix.py'
      - '.github/workflows/aaa-readability-emergency-fix.yml'

permissions:
  contents: write

jobs:
  apply-readability-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Run AAA readability emergency fix
        run: python3 scripts/apply_aaa_readability_emergency_fix.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: apply AAA readability emergency contrast fix"
            git push origin HEAD:${{ github.ref_name }}
          fi
