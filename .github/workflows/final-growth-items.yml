name: Final growth items

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  final-growth-items:
    name: Apply final growth items
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply tracking, R2D2, ticket notice and schema
        run: python3 scripts/apply_tracking_and_r2d2_assets.py

      - name: Apply final growth items
        run: python3 scripts/apply_final_growth_items.py

      - name: Show reports
        if: always()
        run: |
          if [ -f _audit_reports/tracking_and_r2d2_assets_report.md ]; then
            cat _audit_reports/tracking_and_r2d2_assets_report.md
          fi
          if [ -f _audit_reports/final_growth_items_report.md ]; then
            cat _audit_reports/final_growth_items_report.md
          fi

      - name: Upload final growth reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-growth-items-reports
          path: |
            _audit_reports/tracking_and_r2d2_assets_report.md
            _audit_reports/final_growth_items_report.md
            sitemap.xml

      - name: Commit generated growth files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add _audit_reports/ sitemap.xml
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: apply final growth items"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin master && exit 0
            echo "Push attempt $i/3 failed, retrying…"; sleep $((i * 3))
          done
          exit 1
