name: Update version.json

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  update-version:
    name: Stamp version.json with deploy SHA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp deploy SHA and date
        run: |
          SHA="${{ github.sha }}"
          DATE=$(date -u +%Y-%m-%d)
          python3 - <<PYEOF
          import json, pathlib
          p = pathlib.Path("version.json")
          v = json.loads(p.read_text())
          v["deploy_sha"] = "$SHA"
          v["updated_at"] = "$DATE"
          p.write_text(json.dumps(v, indent=2, ensure_ascii=False) + "\n")
          print(f"Stamped: {v['site_version']} @ $SHA")
          PYEOF

      - name: Commit updated version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: stamp version.json with deploy SHA ${{ github.sha }}"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin master && exit 0
            echo "Push attempt $i/3 failed, retrying…"; sleep $((i * 3))
          done
          exit 1
