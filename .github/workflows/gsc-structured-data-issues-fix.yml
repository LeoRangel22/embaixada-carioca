name: GSC structured data issues fix

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/apply_gsc_structured_data_issues_fix.py"
      - "scripts/apply_gsc_emergency_validation_cleaner.py"
      - "scripts/validate_gsc_postfix_structured_data.py"
      - ".github/workflows/gsc-structured-data-issues-fix.yml"

permissions:
  contents: write

concurrency:
  group: gsc-structured-data-issues-fix-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  fix-gsc-structured-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply GSC structured data issues fix
        run: python3 scripts/apply_gsc_structured_data_issues_fix.py

      - name: Apply GSC emergency validation cleaner
        run: python3 scripts/apply_gsc_emergency_validation_cleaner.py

      - name: Validate GSC post-fix structured data
        run: python3 scripts/validate_gsc_postfix_structured_data.py

      - name: Commit GSC structured data fixes and reports
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve GSC validation blockers"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo "Failed to push after retries"
          exit 1
