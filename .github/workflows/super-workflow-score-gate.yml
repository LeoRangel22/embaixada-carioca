name: Super workflow score gate

on:
  workflow_dispatch:
    inputs:
      score_threshold:
        description: "Minimum score required for every audit workflow"
        required: false
        default: "90"
      max_attempts:
        description: "Maximum attempts"
        required: false
        default: "4"
      wait_seconds:
        description: "Seconds to wait between attempts"
        required: false
        default: "120"
  push:
    branches:
      - master
    paths:
      - "**/*.html"
      - "assets/**/*.css"
      - "assets/**/*.js"
      - "manifest.json"
      - "scripts/**/*.py"
      - ".github/workflows/*.yml"

permissions:
  contents: write

concurrency:
  group: super-workflow-score-gate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  super-workflow-score-gate:
    name: Run all audit reports until score gate passes
    runs-on: ubuntu-latest
    env:
      SCORE_THRESHOLD: ${{ github.event.inputs.score_threshold || '90' }}
      MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '4' }}
      WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || '120' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run super workflow score gate
        run: python3 scripts/run_super_workflow_score_gate.py

      - name: Show executive audit reports
        if: always()
        run: |
          echo "===== Executive audit reports ====="
          echo "1. _audit_reports/super_workflow_score_gate.md"
          echo "2. _audit_reports/superholistic_design_ux_seo_geo_audit.md"
          echo "3. _audit_reports/gsc_real_queries_score_audit.md"
          echo "4. _audit_reports/priority_keywords_aio_score_audit.md"

          if [ -f _audit_reports/super_workflow_score_gate.md ]; then
            echo ""
            echo "===== Super Workflow Score Gate ====="
            cat _audit_reports/super_workflow_score_gate.md
          fi

          if [ -f _audit_reports/superholistic_design_ux_seo_geo_audit.md ]; then
            echo ""
            echo "===== Superholistic Design UX SEO GEO Audit ====="
            cat _audit_reports/superholistic_design_ux_seo_geo_audit.md
          fi

          if [ -f _audit_reports/gsc_real_queries_score_audit.md ]; then
            echo ""
            echo "===== GSC Real Organic Queries Score Audit ====="
            cat _audit_reports/gsc_real_queries_score_audit.md
          fi

          if [ -f _audit_reports/priority_keywords_aio_score_audit.md ]; then
            echo ""
            echo "===== Priority Keywords AIO Score Audit ====="
            cat _audit_reports/priority_keywords_aio_score_audit.md
          fi

          if [ -f _audit_reports/superholistic_visual_readability_lock_report.md ]; then
            echo ""
            echo "===== Superholistic Visual Readability Lock ====="
            cat _audit_reports/superholistic_visual_readability_lock_report.md
          fi

      - name: Upload all audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-workflow-score-gate-reports
          if-no-files-found: ignore
          path: |
            _audit_reports/*.md
            _audit_reports/*.csv
            _audit_reports/*.json

      - name: Commit updated reports and automatic fixes
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add **/*.html assets/**/*.css manifest.json _audit_reports/*.md _audit_reports/*.csv _audit_reports/*.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "audit: update super workflow score gate reports"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo "Failed to push after retries"
          exit 1
