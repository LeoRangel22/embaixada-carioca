name: Legibility contrast lock

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_legibility_contrast_lock.py'
      - '.github/workflows/legibility-contrast-lock.yml'

permissions:
  contents: write

jobs:
  apply-legibility-contrast-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Run legibility contrast lock
        run: python3 scripts/apply_legibility_contrast_lock.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: apply legibility contrast lock"
            git push origin HEAD:${{ github.ref_name }}
          fi
