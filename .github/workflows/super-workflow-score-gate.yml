name: Super workflow score gate

on:
  workflow_dispatch:
    inputs:
      score_threshold:
        description: "Minimum score required for every audit workflow"
        required: false
        default: "90"
      max_attempts:
        description: "Maximum attempts"
        required: false
        default: "4"
      wait_seconds:
        description: "Seconds to wait between attempts"
        required: false
        default: "120"
  push:
    branches:
      - master
    paths:
      - "**/*.html"
      - "assets/**/*.css"
      - "assets/**/*.js"
      - "manifest.json"
      - "scripts/**/*.py"
      - ".github/workflows/*.yml"

permissions:
  contents: write

jobs:
  super-workflow-score-gate:
    name: Run all audit reports until score gate passes
    runs-on: ubuntu-latest
    env:
      SCORE_THRESHOLD: ${{ github.event.inputs.score_threshold || '90' }}
      MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '4' }}
      WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || '120' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run super workflow score gate
        run: python3 scripts/run_super_workflow_score_gate.py

      - name: Show score gate report
        if: always()
        run: |
          if [ -f _audit_reports/super_workflow_score_gate.md ]; then
            cat _audit_reports/super_workflow_score_gate.md
          fi
          if [ -f _audit_reports/priority_keywords_aio_score_audit.md ]; then
            echo ""
            echo "===== Priority Keywords AIO Score Audit ====="
            cat _audit_reports/priority_keywords_aio_score_audit.md
          fi

      - name: Upload all audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-workflow-score-gate-reports
          path: |
            _audit_reports/*.md
            _audit_reports/*.csv
            _audit_reports/*.json
            _audit_reports/priority_keywords_aio_score_audit.md
            _audit_reports/priority_keywords_aio_score_audit.csv
            _audit_reports/priority_keywords_aio_score_audit.json

      - name: Commit updated reports and automatic fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: "audit: update super workflow score gate reports"
          file_pattern: >-
            index.html
            cafe-da-manha.html
            almoco.html
            cardapio.html
            como-chegar.html
            eventos.html
            guia-do-rio.html
            restaurante-morro-da-urca.html
            manifest.json
            _audit_reports/*.md
            _audit_reports/*.csv
            _audit_reports/*.json
            _audit_reports/priority_keywords_aio_score_audit.md
            _audit_reports/priority_keywords_aio_score_audit.csv
            _audit_reports/priority_keywords_aio_score_audit.json
