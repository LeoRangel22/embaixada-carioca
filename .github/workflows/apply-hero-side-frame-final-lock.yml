name: Apply hero side frame final lock

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-hero-side-frame-final-lock.yml'
      - 'assets/css/ec-contrast-hotfix.css'
      - 'scripts/audit_visual_contrast_risks.py'

permissions:
  contents: write

jobs:
  apply-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply final CSS lock inside HTML pages
        shell: bash
        run: |
          set -euo pipefail
          pages=(index.html cafe-da-manha.html almoco.html cardapio.html como-chegar.html eventos.html guia-do-rio.html)
          cat > /tmp/hero-lock.html <<'EOF'
          <!-- EC Hero Side Frame Final Contrast Lock -->
          <style id="ec-hero-side-frame-final-contrast-lock">
          html body .ec-page-hero-side-frame,
          html body .hero-summary-card,
          html body .hmc {
            background: rgba(0,32,46,.92) !important;
            border-color: rgba(246,239,222,.42) !important;
            box-shadow: 0 22px 64px rgba(0,0,0,.58) !important;
            color: #f6efde !important;
            -webkit-text-fill-color: #f6efde !important;
            text-shadow: none !important;
            opacity: 1 !important;
          }
          html body .ec-page-hero-side-frame *,
          html body .hero-summary-card *,
          html body .hmc * {
            opacity: 1 !important;
          }
          html body .ec-page-hero-side-frame .l,
          html body .ec-page-hero-side-frame .label,
          html body .ec-page-hero-side-frame .kicker,
          html body .ec-page-hero-side-frame .eyebrow,
          html body .hero-summary-card .l,
          html body .hero-summary-card .label,
          html body .hero-summary-card .kicker,
          html body .hero-summary-card .eyebrow,
          html body .hmc .l,
          html body .hmc .label,
          html body .hmc .kicker,
          html body .hmc .eyebrow {
            color: #f2b24a !important;
            -webkit-text-fill-color: #f2b24a !important;
            text-shadow: 0 2px 10px rgba(0,0,0,.66) !important;
            font-weight: 900 !important;
            letter-spacing: .26em !important;
          }
          html body .ec-page-hero-side-frame .v,
          html body .ec-page-hero-side-frame .value,
          html body .ec-page-hero-side-frame p,
          html body .hero-summary-card .v,
          html body .hero-summary-card .value,
          html body .hero-summary-card p,
          html body .hmc .v,
          html body .hmc .value,
          html body .hmc p {
            color: #f6efde !important;
            -webkit-text-fill-color: #f6efde !important;
            text-shadow: 0 2px 12px rgba(0,0,0,.70) !important;
            font-weight: 750 !important;
            font-size: clamp(15px, 4vw, 18px) !important;
            line-height: 1.35 !important;
          }
          </style>
          EOF

          mkdir -p _audit_reports
          : > _audit_reports/hero_side_frame_final_lock_report.md
          echo '# Hero Side Frame Final Lock Report' >> _audit_reports/hero_side_frame_final_lock_report.md
          echo '' >> _audit_reports/hero_side_frame_final_lock_report.md
          for page in "${pages[@]}"; do
            if [[ ! -f "$page" ]]; then
              echo "- $page: missing" >> _audit_reports/hero_side_frame_final_lock_report.md
              continue
            fi
            if grep -q 'ec-hero-side-frame-final-contrast-lock' "$page"; then
              echo "- $page: already present" >> _audit_reports/hero_side_frame_final_lock_report.md
              continue
            fi
            if grep -qE 'ec-page-hero-side-frame|hero-summary-card|hmc' "$page"; then
              python3 - <<PY
from pathlib import Path
page = Path('$page')
lock = Path('/tmp/hero-lock.html').read_text()
text = page.read_text()
if '</body>' in text:
    text = text.replace('</body>', lock + '\n</body>', 1)
else:
    text = text + '\n' + lock + '\n'
page.write_text(text)
PY
              echo "- $page: final lock inserted" >> _audit_reports/hero_side_frame_final_lock_report.md
            else
              echo "- $page: no hero side frame found" >> _audit_reports/hero_side_frame_final_lock_report.md
            fi
          done

      - name: Run visual contrast risk audit
        run: python3 scripts/audit_visual_contrast_risks.py

      - name: Show reports
        run: |
          cat _audit_reports/hero_side_frame_final_lock_report.md
          echo '---'
          cat _audit_reports/visual_contrast_risk_audit.md

      - name: Commit final hero side frame lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: apply final hero side frame contrast lock'
          file_pattern: >-
            index.html
            cafe-da-manha.html
            almoco.html
            cardapio.html
            como-chegar.html
            eventos.html
            guia-do-rio.html
            _audit_reports/hero_side_frame_final_lock_report.md
            _audit_reports/visual_contrast_risk_audit.md
