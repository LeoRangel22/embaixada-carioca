name: one-off cafe cardapio contrast min

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-off-cafe-cardapio-contrast-min.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch cafe-da-manha.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('cafe-da-manha.html')
          html=p.read_text(encoding='utf-8',errors='ignore')
          css='''<style id="ec-cafe-cardapio-contrast-min">
body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--escuro,body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--verde-escuro,body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--roxo,body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--amarelo-escuro,body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--cafe{color:#f6efde!important;-webkit-text-fill-color:#f6efde!important;text-shadow:none!important;opacity:1!important}
body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--escuro :is(h3,.item-nome),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--verde-escuro :is(h3,.item-nome),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--roxo :is(h3,.item-nome),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--amarelo-escuro :is(h3,.item-nome),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--cafe :is(h3,.item-nome){color:#f6efde!important;-webkit-text-fill-color:#f6efde!important;opacity:1!important;text-shadow:none!important}
body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--escuro :is(.item-sub,.item-desc,.item-add,.cardapio-card-nota),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--verde-escuro :is(.item-sub,.item-desc,.item-add,.cardapio-card-nota),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--roxo :is(.item-sub,.item-desc,.item-add,.cardapio-card-nota),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--amarelo-escuro :is(.item-sub,.item-desc,.item-add,.cardapio-card-nota),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--cafe :is(.item-sub,.item-desc,.item-add,.cardapio-card-nota){color:#dbe7d0!important;-webkit-text-fill-color:#dbe7d0!important;opacity:1!important}
body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--escuro :is(.item-preco,.cardapio-destaque-mini strong,.metodo-icone),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--verde-escuro :is(.item-preco,.cardapio-destaque-mini strong,.metodo-icone),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--roxo :is(.item-preco,.cardapio-destaque-mini strong,.metodo-icone),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--amarelo-escuro :is(.item-preco,.cardapio-destaque-mini strong,.metodo-icone),body[data-screen-label="Café da Manhã"] .cardapio-grid .cardapio-card--cafe :is(.item-preco,.cardapio-destaque-mini strong,.metodo-icone){color:#ffc62e!important;-webkit-text-fill-color:#ffc62e!important;opacity:1!important}
</style>'''
          html=re.sub(r'\n?<style id="ec-cafe-cardapio-contrast-min">[\s\S]*?</style>\n?','\n',html)
          html=html.replace('</head>',css+'\n</head>',1)
          p.write_text(html,encoding='utf-8')
          Path('.github/workflows/one-off-cafe-cardapio-contrast-min.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: inline cafe cardapio contrast min"
          file_pattern: |
            cafe-da-manha.html
            .github/workflows/one-off-cafe-cardapio-contrast-min.yml
