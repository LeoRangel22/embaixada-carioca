name: Super site standards SEO audit

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/*.html"
      - "assets/**/*.css"
      - "assets/**/*.js"
      - "manifest.json"
      - "scripts/super_site_standards_seo_audit.py"
      - ".github/workflows/super-site-standards-seo-audit.yml"

jobs:
  super-site-standards-seo-audit:
    name: Run super site standards SEO audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run super site standards SEO audit
        run: |
          set +e
          python scripts/super_site_standards_seo_audit.py
          audit_exit=$?
          echo "Audit raw exit code: ${audit_exit}"

          if [ ! -f _audit_reports/super_site_standards_seo_audit.md ]; then
            echo "ERROR: Markdown audit report was not generated."
            exit 1
          fi

          if [ ! -f _audit_reports/super_site_standards_seo_audit_details.csv ]; then
            echo "ERROR: CSV audit report was not generated."
            exit 1
          fi

          echo "Audit reports generated. Findings are advisory and remain documented in the artifact."
          exit 0

      - name: Show super audit summary
        if: always()
        run: |
          if [ -f _audit_reports/super_site_standards_seo_audit.md ]; then
            cat _audit_reports/super_site_standards_seo_audit.md
          fi

      - name: Upload super audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-site-standards-seo-audit
          path: |
            _audit_reports/super_site_standards_seo_audit.md
            _audit_reports/super_site_standards_seo_audit_details.csv
