name: Phase 2 performance SEO audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/audit_phase2_performance_seo.py'
      - 'index.html'
      - 'cafe-da-manha.html'
      - 'almoco.html'
      - 'cardapio.html'
      - 'como-chegar.html'
      - 'eventos.html'
      - 'guia-do-rio.html'
      - '.github/workflows/phase2-performance-seo-audit.yml'

permissions:
  contents: write

jobs:
  phase2-performance-seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Phase 2 performance SEO audit
        run: python3 scripts/audit_phase2_performance_seo.py

      - name: Show Phase 2 report
        run: cat _audit_reports/phase2_performance_seo_audit.md

      - name: Commit Phase 2 report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'audit: update phase 2 performance seo report'
          file_pattern: _audit_reports/phase2_performance_seo_audit.md
