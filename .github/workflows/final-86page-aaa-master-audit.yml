name: Final 86-page AAA master audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/finalize_en_parque_bondinho_scorecard_report.py'
      - 'scripts/apply_en_parque_bondinho_scorecard_fix.py'
      - 'scripts/apply_duplicate_faq_schema_cleaner.py'
      - 'scripts/apply_scorecard_gap_fixes.py'
      - 'scripts/apply_static_product_schema_faq.py'
      - 'scripts/apply_static_schema_product_full_coverage.py'
      - 'scripts/apply_parque_bondinho_access_clarity_fix.py'
      - 'scripts/apply_internal_linking_keyword_cluster_fixes.py'
      - 'scripts/apply_lang_dropdown_closed_state_fix.py'
      - 'scripts/apply_featured_snippet_ordered_lists.py'
      - 'scripts/audit_css_js_refactor_opportunities.py'
      - 'scripts/apply_performance_urgent_quick_wins.py'
      - 'scripts/apply_priority_query_conversion_fixes.py'
      - 'scripts/apply_aio_low_score_editorial_fixes.py'
      - 'scripts/apply_priority_aaa_warn_fixes.py'
      - 'scripts/apply_final_86page_aaa_master_audit_v2.py'
      - '.github/workflows/final-86page-aaa-master-audit.yml'

permissions:
  contents: write

concurrency:
  group: final-86page-aaa-master-audit-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run-final-master-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply EN Parque Bondinho scorecard fix
        run: python3 scripts/apply_en_parque_bondinho_scorecard_fix.py || true
      - name: Apply scorecard gap fixes
        run: python3 scripts/apply_scorecard_gap_fixes.py || true
      - name: Re-apply static product schema guard
        run: python3 scripts/apply_static_product_schema_faq.py
      - name: Re-apply static product schema full coverage
        run: python3 scripts/apply_static_schema_product_full_coverage.py
      - name: Clean duplicate FAQ schema
        run: python3 scripts/apply_duplicate_faq_schema_cleaner.py
      - name: Apply Parque Bondinho access clarity fix
        run: python3 scripts/apply_parque_bondinho_access_clarity_fix.py
      - name: Apply internal linking keyword cluster fixes
        run: python3 scripts/apply_internal_linking_keyword_cluster_fixes.py
      - name: Apply language dropdown closed state fix
        run: python3 scripts/apply_lang_dropdown_closed_state_fix.py
      - name: Apply featured snippet ordered lists
        run: python3 scripts/apply_featured_snippet_ordered_lists.py
      - name: Audit CSS JS refactor opportunities
        run: python3 scripts/audit_css_js_refactor_opportunities.py
      - name: Apply performance urgent quick wins
        run: python3 scripts/apply_performance_urgent_quick_wins.py
      - name: Apply priority query conversion fixes
        run: python3 scripts/apply_priority_query_conversion_fixes.py
      - name: Apply AIO low score editorial fixes
        run: python3 scripts/apply_aio_low_score_editorial_fixes.py
      - name: Apply priority AAA WARN fixes
        run: python3 scripts/apply_priority_aaa_warn_fixes.py
      - name: Finalize EN Parque Bondinho scorecard report
        run: python3 scripts/finalize_en_parque_bondinho_scorecard_report.py || true
      - name: Run final 86-page AAA master audit
        run: python3 scripts/apply_final_86page_aaa_master_audit_v2.py
      - name: Commit fixes and reports
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: finalize EN Parque Bondinho scorecard report"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo "Failed to push after retries"
          exit 1
