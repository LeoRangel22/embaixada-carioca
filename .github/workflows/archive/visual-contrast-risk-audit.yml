name: Visual contrast risk audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_hero_side_frame_final_lock.py'
      - 'scripts/audit_visual_contrast_risks.py'
      - 'assets/css/ec-contrast-hotfix.css'
      - 'assets/css/ec-stabilization-base.css'
      - 'index.html'
      - 'cafe-da-manha.html'
      - 'almoco.html'
      - 'cardapio.html'
      - 'como-chegar.html'
      - 'eventos.html'
      - 'guia-do-rio.html'
      - '.github/workflows/visual-contrast-risk-audit.yml'

permissions:
  contents: write

jobs:
  visual-contrast-risk-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply hero side frame final lock
        run: python3 scripts/apply_hero_side_frame_final_lock.py

      - name: Run visual contrast risk audit
        run: python3 scripts/audit_visual_contrast_risks.py

      - name: Show reports
        run: |
          cat _audit_reports/hero_side_frame_final_lock_report.md
          echo '---'
          cat _audit_reports/visual_contrast_risk_audit.md

      - name: Commit visual contrast reports and locks
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: apply hero side frame lock and update contrast audit'
          file_pattern: >-
            index.html
            cafe-da-manha.html
            almoco.html
            cardapio.html
            como-chegar.html
            eventos.html
            guia-do-rio.html
            _audit_reports/hero_side_frame_final_lock_report.md
            _audit_reports/visual_contrast_risk_audit.md
