name: one-off apply green solid palette

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/one-off-apply-green-solid-palette.yml"

permissions:
  contents: write

concurrency:
  group: one-off-apply-green-solid-palette
  cancel-in-progress: true

jobs:
  apply-green-solid-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply green solid palette to real green pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          skip_dirs = {'.git', '.github', '_audit_reports', 'archive', 'node_modules', 'dist', 'build'}
          GREEN_CSS = '/assets/css/ec-green-solid-palette.css'
          BASE_CSS = 'ec-stabilization-base.css'
          LINK = f'<link rel="stylesheet" href="{GREEN_CSS}">\n'
          STYLE_RE = re.compile(r'<style[^>]*>(.*?)</style>', re.I | re.S)
          CLASS_RE = re.compile(r'class=["\'][^"\']*(?:green-section|section-green|ec-green-solid|bg-green|verde-section|cafe-green|breakfast-green|menu-green)[^"\']*["\']', re.I)
          REAL_BACKGROUND_RE = re.compile(
              r'(?:background|background-color)\s*:\s*(?:var\(--verde\)|var\(--ec-green-solid\)|#152f22|#153022|#0f2b1f|#102f22|#0e2a20|#123321|linear-gradient\([^;{}]*(?:#152f22|#153022|var\(--verde\)|var\(--ec-green-solid\)))',
              re.I,
          )

          def strip_css(html: str) -> str:
              parts = []
              for match in STYLE_RE.finditer(html):
                  css = match.group(1)
                  css = re.sub(r':root\s*\{.*?\}', '', css, flags=re.I | re.S)
                  parts.append(css)
              parts.extend(re.findall(r'style=["\']([^"\']+)["\']', html, flags=re.I | re.S))
              return '\n'.join(parts)

          def real_green(html: str) -> bool:
              return bool(REAL_BACKGROUND_RE.search(strip_css(html)) or CLASS_RE.search(html))

          def covered(html: str) -> bool:
              return 'ec-green-solid-palette.css' in html or BASE_CSS in html

          changed = []
          for path in sorted(root.rglob('*.html')):
              if any(part in skip_dirs for part in path.parts):
                  continue
              html = path.read_text(encoding='utf-8', errors='ignore')
              if not real_green(html) or covered(html):
                  continue
              if '</head>' not in html:
                  continue
              html = html.replace('</head>', LINK + '</head>', 1)
              path.write_text(html, encoding='utf-8')
              changed.append(str(path))

          print('green solid palette links added:', len(changed))
          for item in changed:
              print('-', item)
          PY

      - name: Run refined audit
        run: python3 scripts/audit_green_solid_palette.py
        continue-on-error: true

      - name: Remove this one-off workflow
        run: rm -f .github/workflows/one-off-apply-green-solid-palette.yml

      - name: Commit green solid palette application
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: apply green solid palette to real green pages"
          file_pattern: |
            **/*.html
            _audit_reports/green_solid_palette_audit_report.md
            _audit_reports/green_solid_palette_audit_report.json
            .github/workflows/one-off-apply-green-solid-palette.yml
