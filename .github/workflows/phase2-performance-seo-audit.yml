name: Phase 2 performance SEO audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_phase2_quick_fixes.py'
      - 'scripts/audit_phase2_performance_seo.py'
      - 'index.html'
      - 'cafe-da-manha.html'
      - 'almoco.html'
      - 'cardapio.html'
      - 'como-chegar.html'
      - 'eventos.html'
      - 'guia-do-rio.html'
      - '.github/workflows/phase2-performance-seo-audit.yml'

permissions:
  contents: write

jobs:
  phase2-performance-seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply safe Phase 2 quick fixes
        run: python3 scripts/apply_phase2_quick_fixes.py

      - name: Run Phase 2 performance SEO audit
        run: python3 scripts/audit_phase2_performance_seo.py

      - name: Show reports
        run: |
          cat _audit_reports/phase2_quick_fixes_report.md
          echo '---'
          cat _audit_reports/phase2_performance_seo_audit.md

      - name: Commit Phase 2 reports and quick fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: apply phase 2 quick fixes and update audit'
          file_pattern: >-
            index.html
            _audit_reports/phase2_quick_fixes_report.md
            _audit_reports/phase2_performance_seo_audit.md
