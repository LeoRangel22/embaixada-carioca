name: Diagnose Lojas Bot host

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/diagnose-lojas-bot-host.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: DNS and HTTP diagnostics
        run: |
          set +e
          echo '=== DNS ==='
          dig +short www.embaixadacarioca.com A
          dig +short www.embaixadacarioca.com CNAME
          echo '=== ROOT HEADERS ==='
          curl -sS -I --max-time 20 https://www.embaixadacarioca.com/ || true
          echo '=== LOJAS-BOT HEADERS ==='
          curl -sS -I --max-time 20 https://www.embaixadacarioca.com/lojas-bot/ || true
          echo '=== GITHUB PAGES ORIGIN ==='
          curl -sS -I --max-time 20 https://leorangel22.github.io/embaixada-carioca/lojas-bot/ || true
          echo '=== ROOT BODY HASH ==='
          curl -sS -L --max-time 20 https://www.embaixadacarioca.com/ -o /tmp/root.html || true
          wc -c /tmp/root.html 2>/dev/null || true
          sha256sum /tmp/root.html 2>/dev/null || true
          echo '=== WRAPPER BODY ==='
          curl -sS -L --max-time 20 https://www.embaixadacarioca.com/lojas-bot/ -o /tmp/wrap.html || true
          wc -c /tmp/wrap.html 2>/dev/null || true
          head -c 500 /tmp/wrap.html 2>/dev/null || true
