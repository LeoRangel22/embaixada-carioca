name: Home reference top nav lock

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_home_reference_top_nav_lock.py'
      - '.github/workflows/home-reference-top-nav-lock.yml'

permissions:
  contents: write

concurrency:
  group: home-reference-top-nav-lock-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lock-home-reference-top-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply home reference top nav lock
        run: python3 scripts/apply_home_reference_top_nav_lock.py

      - name: Commit home reference top nav lock
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: lock top navigation to home reference"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          exit 1
