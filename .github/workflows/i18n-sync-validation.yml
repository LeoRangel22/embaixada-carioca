name: i18n Sync Validation
on:
  push:
  pull_request:
    branches: [master]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_i18n_sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-sync-report
          path: _audit_reports/i18n_sync_report.md
