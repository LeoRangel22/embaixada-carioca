<style>
:root {
  --azul1: #00405a;
  --azul2: #527f8f;
  --verde: #335d4a;
  --verde2: #cbded4;
  --amarelo: #f59b1e;
  --amarelo-deep: #c47e15;
  --areia: #ede2c9;
  --areia-pale: #f6efde;
  --areia-deep: #e0d3b5;
  --cinza1: #485156;
  --cinza2: #7d8386;
  --cinza3: #b1b7bc;
  --paper: var(--areia-pale);
  --ink: var(--azul1);
  --ink-2: var(--cinza1);
  --rule: rgba(0,64,90,0.18);
  --rule-soft: rgba(0,64,90,0.08);
  --max: 1440px;
  --gutter: 64px;
}

  /* Two-column B2B layout */
  .audience-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
  .audience-card {
    background: var(--areia);
    border: 1px solid var(--rule-soft);
    padding: 56px 48px 48px;
    display: flex; flex-direction: column;
  }
  .audience-card.variant { background: var(--verde2); }
  .audience-tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--azul2);
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 28px;
    font-weight: 500;
  }
  .audience-card.variant .audience-tag { color: var(--verde); border-color: rgba(51,93,74,0.25); }
  .audience-card h3 {
    font-family: "Catamaran", sans-serif;
    font-weight: 300;
    font-size: clamp(32px, 3.4vw, 48px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 20px;
    color: var(--azul1);
  }
  .audience-card h3 .serif { font-style: italic; font-weight: 500; color: var(--verde); font-family: "Cormorant Garamond", serif; }
  .audience-card.variant h3 .serif { color: var(--amarelo-deep); }
  .audience-lede {
    font-size: 17px;
    line-height: 1.55;
    color: var(--cinza1);
    margin: 0 0 32px;
    max-width: 44ch;
  }
  .audience-list {
    list-style: none; padding: 0; margin: 0 0 36px;
    display: flex; flex-direction: column;
    flex: 1;
  }
  .audience-list li {
    padding: 18px 0;
    border-top: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 4px;
  }
  .audience-card.variant .audience-list li { border-top-color: rgba(51,93,74,0.18); }
  .audience-list li:last-child { border-bottom: 1px solid var(--rule); }
  .audience-card.variant .audience-list li:last-child { border-bottom-color: rgba(51,93,74,0.18); }
  .audience-l { font-family: "Catamaran", sans-serif; font-weight: 700; font-size: 16px; color: var(--azul1); }
  .audience-d { font-size: 14.5px; color: var(--cinza1); line-height: 1.45; }

  /* Capacity stats */
  .capacity {
    background: var(--azul1);
    color: var(--areia-pale);
  }
  .capacity .sec-head h2 { color: var(--areia-pale); }
  .capacity .sec-head h2 .serif { color: var(--amarelo); }
  .capacity .sec-head .num { color: rgba(237,226,201,0.65); }
  .capacity .sec-head .lede { color: rgba(237,226,201,0.78); }

  .cap-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    padding: 40px 0;
    border-top: 1px solid rgba(237,226,201,0.18);
    border-bottom: 1px solid rgba(237,226,201,0.18);
  }
  .cap {
    display: flex; flex-direction: column; gap: 8px;
  }
  .cap .l {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--amarelo);
  }
  .cap .v {
    font-family: "Catamaran", sans-serif;
    font-weight: 200;
    font-size: 64px;
    line-height: 1;
    color: var(--areia-pale);
    letter-spacing: -0.03em;
  }
  .cap .v sup { font-size: 18px; vertical-align: super; margin-left: 4px; color: var(--amarelo); }
  .cap .d { font-size: 14px; color: rgba(237,226,201,0.75); line-height: 1.4; margin-top: 2px; }

  /* FAQ */
  .faq-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px 56px;
  }
  .faq {
    border-top: 1px solid var(--rule);
    padding: 24px 0 8px;
  }
  .faq h4 {
    font-family: "Catamaran", sans-serif;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.25;
    color: var(--azul1);
    margin: 0 0 12px;
  }
  .faq p {
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--cinza1);
    margin: 0 0 16px;
  }

  /* Form */
  .form-section { background: var(--areia); }
  .form-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 80px;
    align-items: start;
  }
  .form-intro h2 {
    font-family: "Catamaran", sans-serif;
    font-weight: 300;
    font-size: clamp(36px, 4.4vw, 64px);
    line-height: 1.02;
    margin: 0 0 24px;
    letter-spacing: -0.02em;
    color: var(--azul1);
  }
  .form-intro h2 .serif { font-style: italic; font-weight: 500; color: var(--amarelo); font-family: "Cormorant Garamond", serif; }
  .form-intro p {
    font-size: 17px;
    line-height: 1.65;
    color: var(--cinza1);
    margin: 0 0 20px;
    max-width: 46ch;
  }
  .form-intro .contacts {
    margin-top: 32px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .form-intro .contacts .l {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--azul2);
  }
  .form-intro .contacts a {
    color: var(--azul1);
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
  }
  .form-intro .contacts a:hover { color: var(--amarelo-deep); }

  form.cotacao {
    background: var(--areia-pale);
    border: 1px solid var(--rule);
    padding: 40px 36px;
    display: flex; flex-direction: column;
    gap: 18px;
  }
  form.cotacao label {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--azul2);
    margin-bottom: 6px;
    font-weight: 500;
  }
  form.cotacao input, form.cotacao select, form.cotacao textarea {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    padding: 12px 0;
    font-family: "Catamaran", sans-serif;
    font-size: 16px;
    color: var(--azul1);
    outline: none;
    transition: border-color .2s;
  }
  form.cotacao textarea { min-height: 80px; resize: vertical; }
  form.cotacao input:focus, form.cotacao select:focus, form.cotacao textarea:focus {
    border-bottom-color: var(--amarelo);
  }
  form.cotacao input::placeholder, form.cotacao textarea::placeholder { color: var(--cinza2); }
  form.cotacao .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  form.cotacao button {
    margin-top: 20px;
    padding: 16px 28px;
    border: 0;
    background: var(--azul1);
    color: var(--areia-pale);
    font-family: "Catamaran", sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  form.cotacao button:hover { background: var(--amarelo); color: var(--azul1); }

  @media (max-width: 1100px) {
    .audience-grid { grid-template-columns: 1fr; }
    .cap-grid { grid-template-columns: 1fr 1fr; }
    .faq-grid, .form-grid { grid-template-columns: 1fr !important; gap: 32px; }
    form.cotacao .row { grid-template-columns: 1fr; }
  }

/* Botão hambúrguer */
.nav-hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 44px;
  height: 44px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
  transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
  z-index: 200;
}
.nav-hamburger:hover { background: rgba(255,255,255,0.1); }
nav.top.scrolled .nav-hamburger:hover { background: rgba(0,64,90,0.08); }
.nav-hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: currentColor;
  border-radius: 2px;
  transition: transform 0.3s ease, opacity 0.3s ease, width 0.3s ease;
  transform-origin: center;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; width: 0; }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Overlay escuro */
.nav-drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 150;
  backdrop-filter: blur(2px);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.nav-drawer-overlay.open {
  display: block;
  opacity: 1;
}

/* Drawer lateral */
.nav-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(320px, 88vw);

  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;

  -webkit-overflow-scrolling: touch;
}
.nav-drawer.open {
  transform: translateX(0);
}
.nav-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
.nav-drawer-logo {

  width: 40px;

}

  font-family: "JetBrains Mono", monospace;

  transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.nav-drawer-close:hover { background: rgba(255,255,255,0.16); }

/* Links do drawer */
.nav-drawer-links {
  list-style: none;
  padding: 16px 0;
  margin: 0;
  flex: 1;
}
.nav-drawer-links li {
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav-drawer-links a {
  display: flex;

.nav-drawer-links a:hover,

}
.nav-drawer-links .drawer-icon {
  font-size: 18px;

  text-align: center;

}

/* CTA no drawer */
.nav-drawer-cta {
  padding: 24px;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.nav-drawer-cta a {
  display: flex;

  gap: 10px;
  padding: 16px 24px;
  background: var(--amarelo, #E8C547);

/* Info de contato no drawer */
