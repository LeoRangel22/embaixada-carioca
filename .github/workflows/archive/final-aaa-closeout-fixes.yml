name: Final AAA closeout fixes

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_final_aaa_closeout_fixes.py'
      - '.github/workflows/final-aaa-closeout-fixes.yml'

permissions:
  contents: write

jobs:
  apply-final-aaa-closeout-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Run final AAA closeout fixes
        run: python3 scripts/apply_final_aaa_closeout_fixes.py
      - name: Run final 86-page AAA master audit
        run: python3 scripts/apply_final_86page_aaa_master_audit.py
      - name: Commit changes and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: close final AAA audit gaps"
            git push origin HEAD:${{ github.ref_name }}
          fi
