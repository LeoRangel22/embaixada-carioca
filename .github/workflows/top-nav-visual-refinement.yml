name: Top nav visual refinement

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: top-nav-visual-refinement-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  refine-top-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply top nav visual refinement
        run: python3 scripts/apply_top_nav_visual_refinement.py

      - name: Commit top nav visual refinement
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: refine top navigation visual consistency"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          exit 1
