name: one-off P0 site fixes

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-off-p0-site-fixes.yml"

permissions:
  contents: write

concurrency:
  group: one-off-p0-site-fixes
  cancel-in-progress: true

jobs:
  p0-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply P0 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          skip_dirs = {'.git', '.github', '_audit_reports', 'archive', 'node_modules', 'dist', 'build'}
          changed = []

          def read(path):
              return path.read_text(encoding='utf-8', errors='ignore')

          def write_if_changed(path, old, new):
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          # 1) Runtime cardápio café: connect JS directly on cafe-da-manha.html before </body>.
          cafe = root / 'cafe-da-manha.html'
          if cafe.exists():
              old = read(cafe)
              new = old
              # Remove older inline attempts to avoid conflicts and duplicate observers.
              for sid in [
                  'ec-cafe-cardapio-live-contrast-fix',
                  'ec-cardapio-cafe-contrast-final-lock',
                  'ec-cafe-cardapio-inline-contrast-lock',
                  'ec-cafe-cardapio-contrast-min',
                  'ec-cafe-dark-card-runtime-fix',
              ]:
                  new = re.sub(r'\n?<(style|script) id="' + re.escape(sid) + r'">[\s\S]*?</\1>\n?', '\n', new)
              # Remove older duplicate external references if any.
              new = re.sub(r'\n?\s*<script\s+defer\s+src="/assets/js/ec-cafe-cardapio-runtime-contrast\.js[^\"]*"\s*></script>\s*\n?', '\n', new)
              script = '<script defer src="/assets/js/ec-cafe-cardapio-runtime-contrast.js?v=p0-20260525"></script>'
              if '</body>' in new:
                  new = new.replace('</body>', script + '\n</body>', 1)
              else:
                  new += '\n' + script + '\n'
              # Normalize cafe schema URLs to canonical .html.
              new = new.replace('https://www.embaixadacarioca.com/cafe-da-manha#webpage', 'https://www.embaixadacarioca.com/cafe-da-manha.html#webpage')
              new = new.replace('"url":"https://www.embaixadacarioca.com/cafe-da-manha"', '"url":"https://www.embaixadacarioca.com/cafe-da-manha.html"')
              new = new.replace('"item":"https://www.embaixadacarioca.com/cafe-da-manha"', '"item":"https://www.embaixadacarioca.com/cafe-da-manha.html"')
              write_if_changed(cafe, old, new)

          # 2) Global copy consistency: Restaurante do Bondinho -> Restaurante no Bondinho.
          replacements = [
              ('Restaurante do Bondinho', 'Restaurante no Bondinho'),
              ('restaurante do Bondinho', 'restaurante no Bondinho'),
              ('restaurante do bondinho', 'restaurante no bondinho'),
              ('RESTAURANTE DO BONDINHO', 'RESTAURANTE NO BONDINHO'),
          ]
          for path in sorted(root.rglob('*.html')):
              if any(part in skip_dirs for part in path.parts):
                  continue
              old = read(path)
              new = old
              for a, b in replacements:
                  new = new.replace(a, b)
              write_if_changed(path, old, new)

          # 3) Minimal report for verification.
          report_dir = root / '_audit_reports'
          report_dir.mkdir(exist_ok=True)
          cafe_html = read(cafe) if cafe.exists() else ''
          report = []
          report.append('# P0 Site Fixes Report')
          report.append('')
          report.append('- Runtime JS connected on `cafe-da-manha.html`: ' + str('ec-cafe-cardapio-runtime-contrast.js?v=p0-20260525' in cafe_html))
          report.append('- Cafe schema uses `.html#webpage`: ' + str('cafe-da-manha.html#webpage' in cafe_html))
          report.append('- Cafe schema breadcrumb uses `.html`: ' + str('"item":"https://www.embaixadacarioca.com/cafe-da-manha.html"' in cafe_html))
          report.append('- Remaining `Restaurante do Bondinho` in HTML files:')
          remaining = []
          for path in sorted(root.rglob('*.html')):
              if any(part in skip_dirs for part in path.parts):
                  continue
              txt = read(path)
              if 'Restaurante do Bondinho' in txt or 'restaurante do Bondinho' in txt or 'restaurante do bondinho' in txt or 'RESTAURANTE DO BONDINHO' in txt:
                  remaining.append(str(path))
          if remaining:
              report.extend(['  - `' + item + '`' for item in remaining])
          else:
              report.append('  - none')
          (report_dir / 'p0_site_fixes_report.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          changed.append(str(report_dir / 'p0_site_fixes_report.md'))

          wf = root / '.github/workflows/one-off-p0-site-fixes.yml'
          if wf.exists():
              wf.unlink()
              changed.append(str(wf))

          print('P0 changed files:')
          for item in sorted(set(changed)):
              print('-', item)
          PY

      - name: Commit and push P0 fixes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafe-da-manha.html assets/js/ec-cafe-cardapio-runtime-contrast.js _audit_reports/p0_site_fixes_report.md .github/workflows/one-off-p0-site-fixes.yml '**/*.html' || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: apply P0 site fixes"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            git rebase --abort || true
            sleep 3
          done
          exit 1
