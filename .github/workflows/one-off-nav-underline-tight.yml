name: one-off nav underline and bondinho copy fix

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/one-off-nav-underline-tight.yml"

permissions:
  contents: write

jobs:
  fix-nav-underline-and-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix nav underline only and bondinho copy
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          changed = []

          # One single visual rule: move only the hover underline up.
          # Do not change nav height, padding, transform, margin, or the hero eyebrow line.
          override = '''
/* EC nav underline tight standard v2 — underline only; menu text stays fixed */
nav.top .links a,
nav.top .nav-links a{position:relative;}
nav.top .links a::after,
nav.top .nav-links a::after{content:"";position:absolute;left:0;right:auto;bottom:-3px!important;width:0;max-width:100%;min-width:0;height:2px;background:var(--amarelo,var(--ec-yellow,#f59b1e));opacity:0;transform:none!important;transform-origin:left center;transition:width .22s ease,opacity .18s ease;}
nav.top .links a:hover::after,
nav.top .links a:focus-visible::after,
nav.top .nav-links a:hover::after,
nav.top .nav-links a:focus-visible::after{width:100%;opacity:1;}
'''.strip()

          old_blocks = [
              r'\n?/\* EC nav underline tight standard — 40% of previous gap \*/.*?\.nav-links a::after\{bottom:-3px!important;\}\n?',
              r'\n?/\* EC nav underline tight standard v2 — underline only; menu text stays fixed \*/.*?nav\.top \.nav-links a:focus-visible::after\{width:100%;opacity:1;\}\n?',
          ]

          replacements = [
              ('Restaurante do Bondinho', 'Restaurante no Bondinho'),
              ('restaurante do Bondinho', 'restaurante no Bondinho'),
              ('restaurante do bondinho', 'restaurante no bondinho'),
              ('RESTAURANTE DO BONDINHO', 'RESTAURANTE NO BONDINHO'),
          ]

          # Shared CSS: reduce the existing override gap from 7px to 3px.
          css = root / 'assets/css/ec-stabilization-base.css'
          if css.exists():
              text = css.read_text(encoding='utf-8', errors='ignore')
              new = text.replace('bottom: -7px !important;', 'bottom: -3px !important;')
              for old, new_text in replacements:
                  new = new.replace(old, new_text)
              if new != text:
                  css.write_text(new, encoding='utf-8')
                  changed.append(str(css))

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in {'.git', 'archive', '_audit_reports', 'node_modules'} for part in path.parts):
                  continue
              if path.suffix.lower() not in {'.html', '.css', '.js', '.json', '.md', '.txt'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              new = text

              for old, new_text in replacements:
                  new = new.replace(old, new_text)

              if path.suffix.lower() == '.html':
                  for pattern in old_blocks:
                      new = re.sub(pattern, '\n', new, flags=re.S)
                  if 'EC nav underline tight standard v2 — underline only; menu text stays fixed' not in new and '</style>' in new:
                      new = new.replace('</style>', '\n' + override + '\n</style>', 1)

              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          wf = root / '.github/workflows/one-off-nav-underline-tight.yml'
          if wf.exists():
              wf.unlink()
              changed.append(str(wf))

          print('changed files:')
          for item in changed:
              print('-', item)
          PY

      - name: Commit nav underline and copy fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: tighten nav underline without moving menu"
          file_pattern: |
            assets/css/ec-stabilization-base.css
            **/*.html
            **/*.css
            **/*.js
            **/*.json
            **/*.md
            **/*.txt
            .github/workflows/one-off-nav-underline-tight.yml
