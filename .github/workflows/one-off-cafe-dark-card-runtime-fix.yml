name: one-off cafe dark card runtime fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-off-cafe-dark-card-runtime-fix.yml"

permissions:
  contents: write

concurrency:
  group: cafe-dark-card-runtime-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inject runtime fix for all dark cardapio cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('cafe-da-manha.html')
          html = p.read_text(encoding='utf-8', errors='ignore')

          script = r'''
<script id="ec-cafe-dark-card-runtime-fix">
(function(){
  'use strict';
  var AREIA = '#f6efde';
  var AREIA_MUTED = '#dbe7d0';
  var AMARELO = '#ffc62e';

  function setElementStyles(el, styles){
    if(!el || !styles) return;
    Object.keys(styles).forEach(function(prop){
      el.style.setProperty(prop, styles[prop], 'important');
    });
  }

  function parseRGB(value){
    var m = String(value || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([0-9.]+))?\)/i);
    if(!m) return null;
    return { r:+m[1], g:+m[2], b:+m[3], a:m[4] == null ? 1 : +m[4] };
  }

  function isDarkCard(card){
    var bg = parseRGB(window.getComputedStyle(card).backgroundColor);
    if(!bg || bg.a < .35) return false;
    var luma = (0.2126 * bg.r) + (0.7152 * bg.g) + (0.0722 * bg.b);
    return luma < 115;
  }

  function fixDarkCard(card){
    setElementStyles(card, {
      color: AREIA,
      '-webkit-text-fill-color': AREIA,
      opacity: '1',
      'text-shadow': 'none',
      filter: 'none',
      'mix-blend-mode': 'normal'
    });

    card.querySelectorAll('h1,h2,h3,h4,h5,h6,.cardapio-card-header,.cardapio-card-header *,.item-nome').forEach(function(el){
      setElementStyles(el, {
        color: AREIA,
        '-webkit-text-fill-color': AREIA,
        opacity: '1',
        'text-shadow': 'none',
        filter: 'none',
        'mix-blend-mode': 'normal'
      });
    });

    card.querySelectorAll('p,li,span,small,.item-sub,.item-desc,.item-add,.cardapio-card-nota').forEach(function(el){
      setElementStyles(el, {
        color: AREIA_MUTED,
        '-webkit-text-fill-color': AREIA_MUTED,
        opacity: '1',
        'text-shadow': 'none',
        filter: 'none',
        'mix-blend-mode': 'normal'
      });
    });

    card.querySelectorAll('.item-preco,.cardapio-destaque-mini strong,.metodo-icone,strong,b').forEach(function(el){
      setElementStyles(el, {
        color: AMARELO,
        '-webkit-text-fill-color': AMARELO,
        opacity: '1',
        'text-shadow': 'none',
        filter: 'none',
        'mix-blend-mode': 'normal'
      });
    });

    card.querySelectorAll('.cardapio-lista li').forEach(function(el){
      setElementStyles(el, {'border-bottom-color':'rgba(246,239,222,.16)'});
    });
  }

  function fixCafeDarkCards(){
    var cards = Array.from(document.querySelectorAll('.cardapio-grid .cardapio-card'));
    var dark = 0;
    cards.forEach(function(card){
      if(isDarkCard(card)){
        dark += 1;
        fixDarkCard(card);
      }
    });
    window.ecCafeDarkCardFix = {
      success: true,
      totalCards: cards.length,
      darkCards: dark,
      sampleItemName: (document.querySelector('.cardapio-grid .cardapio-card .item-nome') && window.getComputedStyle(document.querySelector('.cardapio-grid .cardapio-card .item-nome')).color) || null,
      sampleDarkSub: (document.querySelector('.cardapio-card--cafe .item-sub') && window.getComputedStyle(document.querySelector('.cardapio-card--cafe .item-sub')).color) || null
    };
  }

  function schedule(){
    fixCafeDarkCards();
    window.setTimeout(fixCafeDarkCards, 60);
    window.setTimeout(fixCafeDarkCards, 250);
    window.setTimeout(fixCafeDarkCards, 900);
    window.setTimeout(fixCafeDarkCards, 1600);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', schedule, {once:true});
  } else {
    schedule();
  }
  window.addEventListener('load', schedule, {once:true});

  var observer = new MutationObserver(function(){
    window.clearTimeout(observer._ecTimer);
    observer._ecTimer = window.setTimeout(fixCafeDarkCards, 80);
  });
  observer.observe(document.documentElement, {childList:true, subtree:true, attributes:true, attributeFilter:['class','style']});
})();
</script>
'''.strip()

          html = re.sub(r'\n?<script id="ec-cafe-dark-card-runtime-fix">[\s\S]*?</script>\n?', '\n', html)
          if '</body>' not in html:
            raise SystemExit('ERROR: </body> not found')
          html = html.replace('</body>', script + '\n</body>', 1)
          p.write_text(html, encoding='utf-8')

          wf = Path('.github/workflows/one-off-cafe-dark-card-runtime-fix.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafe-da-manha.html .github/workflows/one-off-cafe-dark-card-runtime-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: runtime dark card contrast on cafe menu"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            git rebase --abort || true
            sleep 3
          done
          exit 1
