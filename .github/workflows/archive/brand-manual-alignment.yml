name: Brand manual alignment

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_brand_manual_alignment.py'
      - '.github/workflows/brand-manual-alignment.yml'

permissions:
  contents: write

jobs:
  apply-brand-manual-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Run brand manual alignment
        run: python3 scripts/apply_brand_manual_alignment.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: apply brand manual alignment"
            git push origin HEAD:${{ github.ref_name }}
          fi
