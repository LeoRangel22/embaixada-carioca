name: Accessibility CI

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.html'
      - 'assets/css/**'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.html'
      - 'assets/css/**'

permissions:
  contents: read

concurrency:
  group: accessibility-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Pa11y accessibility audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 || \
          sudo apt-get install -y -qq \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 || true

      - name: Install pa11y-ci and http-server
        run: npm install -g pa11y-ci http-server

      - name: Start local server
        run: http-server . -p 8080 --silent &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 --timeout 15000

      - name: Run pa11y-ci
        run: pa11y-ci --config .pa11yci.json
        continue-on-error: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report-${{ github.run_number }}
          path: pa11y-report.json
