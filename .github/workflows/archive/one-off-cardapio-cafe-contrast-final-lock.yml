name: one-off breakfast card contrast final lock

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/one-off-cardapio-cafe-contrast-final-lock.yml"

permissions:
  contents: write

concurrency:
  group: one-off-cardapio-cafe-contrast-final-lock
  cancel-in-progress: true

jobs:
  cardapio-cafe-contrast-final-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject final contrast lock after all head CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          skip_dirs = {'.git', '.github', '_audit_reports', 'archive', 'node_modules', 'dist', 'build'}

          lock = r'''
<style id="ec-cardapio-cafe-contrast-final-lock">
/* Final visual lock — breakfast/cardápio cards. Loaded after all legacy inline CSS. */
html body main section#cafe-cardapio .cardapio-card.cardapio-card--escuro,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-escuro,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo-escuro,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--cafe,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--roxo,
html body main .cardapio-card.cardapio-card--escuro,
html body main .cardapio-card.cardapio-card--verde-escuro,
html body main .cardapio-card.cardapio-card--amarelo-escuro,
html body main .cardapio-card.cardapio-card--cafe,
html body main .cardapio-card.cardapio-card--roxo{
  color:#f6efde!important;
  -webkit-text-fill-color:#f6efde!important;
  text-shadow:none!important;
  opacity:1!important;
}

html body main section#cafe-cardapio .cardapio-card.cardapio-card--escuro :is(h3,.cardapio-card-header h3,.item-nome),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-escuro :is(h3,.cardapio-card-header h3,.item-nome),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo-escuro :is(h3,.cardapio-card-header h3,.item-nome),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--cafe :is(h3,.cardapio-card-header h3,.item-nome),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--roxo :is(h3,.cardapio-card-header h3,.item-nome),
html body main .cardapio-card.cardapio-card--escuro :is(h3,.cardapio-card-header h3,.item-nome),
html body main .cardapio-card.cardapio-card--verde-escuro :is(h3,.cardapio-card-header h3,.item-nome),
html body main .cardapio-card.cardapio-card--amarelo-escuro :is(h3,.cardapio-card-header h3,.item-nome),
html body main .cardapio-card.cardapio-card--cafe :is(h3,.cardapio-card-header h3,.item-nome),
html body main .cardapio-card.cardapio-card--roxo :is(h3,.cardapio-card-header h3,.item-nome){
  color:#f6efde!important;
  -webkit-text-fill-color:#f6efde!important;
  text-shadow:none!important;
  opacity:1!important;
  font-weight:800!important;
}

html body main section#cafe-cardapio .cardapio-card.cardapio-card--escuro :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-escuro :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo-escuro :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--cafe :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--roxo :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main .cardapio-card.cardapio-card--escuro :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main .cardapio-card.cardapio-card--verde-escuro :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main .cardapio-card.cardapio-card--amarelo-escuro :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main .cardapio-card.cardapio-card--cafe :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main .cardapio-card.cardapio-card--roxo :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add){
  color:#dbe7d0!important;
  -webkit-text-fill-color:#dbe7d0!important;
  text-shadow:none!important;
  opacity:1!important;
}

html body main section#cafe-cardapio .cardapio-card.cardapio-card--escuro :is(.item-preco,.cardapio-destaque-mini strong),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-escuro :is(.item-preco,.cardapio-destaque-mini strong),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo-escuro :is(.item-preco,.cardapio-destaque-mini strong),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--cafe :is(.item-preco,.cardapio-destaque-mini strong),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--roxo :is(.item-preco,.cardapio-destaque-mini strong),
html body main .cardapio-card.cardapio-card--escuro :is(.item-preco,.cardapio-destaque-mini strong),
html body main .cardapio-card.cardapio-card--verde-escuro :is(.item-preco,.cardapio-destaque-mini strong),
html body main .cardapio-card.cardapio-card--amarelo-escuro :is(.item-preco,.cardapio-destaque-mini strong),
html body main .cardapio-card.cardapio-card--cafe :is(.item-preco,.cardapio-destaque-mini strong),
html body main .cardapio-card.cardapio-card--roxo :is(.item-preco,.cardapio-destaque-mini strong){
  color:#ffc62e!important;
  -webkit-text-fill-color:#ffc62e!important;
  opacity:1!important;
}

html body main section#cafe-cardapio .cardapio-card.cardapio-card--escuro .cardapio-lista li,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-escuro .cardapio-lista li,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo-escuro .cardapio-lista li,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--cafe .cardapio-lista li,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--roxo .cardapio-lista li,
html body main .cardapio-card.cardapio-card--escuro .cardapio-lista li,
html body main .cardapio-card.cardapio-card--verde-escuro .cardapio-lista li,
html body main .cardapio-card.cardapio-card--amarelo-escuro .cardapio-lista li,
html body main .cardapio-card.cardapio-card--cafe .cardapio-lista li,
html body main .cardapio-card.cardapio-card--roxo .cardapio-lista li{
  border-bottom-color:rgba(246,239,222,.14)!important;
}

html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-agua,
html body main .cardapio-card.cardapio-card--amarelo,
html body main .cardapio-card.cardapio-card--verde,
html body main .cardapio-card.cardapio-card--verde-agua{
  color:#00405a!important;
  -webkit-text-fill-color:#00405a!important;
  text-shadow:none!important;
}

html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo :is(h3,.cardapio-card-header h3,.item-nome),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde :is(h3,.cardapio-card-header h3,.item-nome),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-agua :is(h3,.cardapio-card-header h3,.item-nome),
html body main .cardapio-card.cardapio-card--amarelo :is(h3,.cardapio-card-header h3,.item-nome),
html body main .cardapio-card.cardapio-card--verde :is(h3,.cardapio-card-header h3,.item-nome),
html body main .cardapio-card.cardapio-card--verde-agua :is(h3,.cardapio-card-header h3,.item-nome){
  color:#00405a!important;
  -webkit-text-fill-color:#00405a!important;
}

html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-agua :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main .cardapio-card.cardapio-card--amarelo :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main .cardapio-card.cardapio-card--verde :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add),
html body main .cardapio-card.cardapio-card--verde-agua :is(.cardapio-card-nota,.item-sub,.item-desc,.item-add){
  color:#485156!important;
  -webkit-text-fill-color:#485156!important;
  opacity:1!important;
}

html body main section#cafe-cardapio .cardapio-card.cardapio-card--amarelo .item-preco,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde .item-preco,
html body main section#cafe-cardapio .cardapio-card.cardapio-card--verde-agua .item-preco,
html body main .cardapio-card.cardapio-card--amarelo .item-preco,
html body main .cardapio-card.cardapio-card--verde .item-preco,
html body main .cardapio-card.cardapio-card--verde-agua .item-preco{
  color:#9a6500!important;
  -webkit-text-fill-color:#9a6500!important;
  opacity:1!important;
}

html body main .cardapio-card.cardapio-card--verde-agua .cardapio-lista--2col{
  gap:.2rem 1.4rem!important;
}
html body main .cardapio-card.cardapio-card--verde-agua .cardapio-lista--2col li{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) auto!important;
  gap:.5rem!important;
  align-items:baseline!important;
}
</style>
'''.strip()

          targets = []
          for path in sorted(root.rglob('*.html')):
              if any(part in skip_dirs for part in path.parts):
                  continue
              html = path.read_text(encoding='utf-8', errors='ignore')
              if 'cardapio-card' in html and '</head>' in html:
                  targets.append(path)

          changed = []
          for path in targets:
              html = path.read_text(encoding='utf-8', errors='ignore')
              new = re.sub(r'\n?<style id="ec-cardapio-cafe-contrast-final-lock">[\s\S]*?</style>\n?', '\n', html)
              new = new.replace('</head>', lock + '\n</head>', 1)
              if new != html:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          wf = root / '.github/workflows/one-off-cardapio-cafe-contrast-final-lock.yml'
          if wf.exists():
              wf.unlink()
              changed.append(str(wf))

          print('final lock injected in:', len(changed), 'files/workflow entries')
          for item in changed:
              print('-', item)
          PY

      - name: Commit final contrast lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: add final breakfast menu card contrast lock"
          file_pattern: |
            **/*.html
            .github/workflows/one-off-cardapio-cafe-contrast-final-lock.yml
